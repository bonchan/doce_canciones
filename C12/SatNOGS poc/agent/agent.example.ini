; SatNOGS installation agent: copy to agent.ini on each display computer and edit.

[mqtt]
; core2's broker, the same one the ESP32s and wind_world use
broker = nuc.local
port = 1883
username =
password =
; every SatNOGS device (the installation server and these computers) shares this zone, so
; core2's device list shows them together with one click on the zone
zone = satnogs
; this computer's name: its device name, and the start of its displays' ids
name = satnogs-pc2

[installation]
; the computer running the installation server (pnpm start)
url = http://192.168.50.1:5180

[displays]
; one line per screen: <output> = <what it shows, as in the url>
; output names: `xrandr --query` (HDMI-1, DP-1, VGA-1, ...)
; views: view=globe, view=globe&camera=follow, view=image, view=image&audio=1,
;        view=schedule, view=telemetry, view=signal
HDMI-1 = view=globe
VGA-1 = view=image&audio=1

[browser]
command = chromium

[schedule]
; optional: every day power off at `off` and turn back on at `on` (24 h, local time).
; Empty: it only powers off / on when core2 says so
on =
off =
