; Installation settings. Same broker and credentials the ESP32 devices use
; (core2/arduino/config.h) -- this build joins the bus as one more device.
; Nothing here is baked into the export, so an installed copy can be
; repointed by editing this file alone.

[mqtt]
broker_url="tcp://nuc.local:1883"
username="esp32user"
password="1q2w3e4r5t6y"
enabled=true

[device]
; Topics are installation/<zone>/<id>/... exactly as in device_base.h
zone="wind_world"
type="display.wind_world"
name="wind_world"

[wind]
; Wind comes from an anemometer on the bus -- the real one, or the simulator
; in core2/simulator/devices/anemometer.py. Both publish wind_speed (m/s) and
; wind_direction (degrees) in their ordinary telemetry, so we listen to every
; telemetry topic and take any payload carrying those two fields. That way it
; works whatever zone or id the anemometer turns up under.
topic="installation/outdoor/+/telemetry"

[display]
; The placeholder geometry -- box, sphere, cylinder, prism, torus, capsule,
; cone -- that some presets still mix into prop_shapes. Off: only the real
; plants are scattered. A preset made entirely of primitives keeps them
; anyway, rather than emptying the land.
primitives=false
; The F3 debug overlay. Off for the installation; F3 still toggles it, and so
; does the DISPLAY command from the dashboard.
hud=false
; Which world it opens on, by file name in configs/ without the .tres. Empty
; uses whatever the scene has assigned. Overrides the scene on purpose: the
; editor rewrites Main.tscn from memory, so an edit there does not stick.
preset="3_estepa"
; The grass field. By far the most expensive thing in the piece: 22000 blades
; of 24 vertices each, and every vertex evaluates the terrain noise, so it
; costs about three times the whole terrain mesh. Off, none of it is built --
; the coiron props still carry some of that texture, so the ground does not
; read as bare.
grass=false
; Seconds the pointer must sit still before it disappears; it comes straight
; back when the mouse moves. 0 leaves it on screen permanently.
hide_cursor_after=2.0
; Start fullscreen. Off while working on it, on for the gallery -- the machine
; there has no keyboard to press F with.
fullscreen=true
